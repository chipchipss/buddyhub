name: go-binaries

# 可运行二进制构建/发布：
#   - PR / push main → 测试 + 五平台编译验证（产物仅存 artifact，不发布）
#   - push v* tag    → 同上 + 打包上传到 GitHub Release（zip/tar.gz + checksums）
# 固化的发布纪律（曾两次人祸，见仓库 HANDOFF）：-s -w 剥离、二进制版本串 == 源码
# appVersion、tag 版本 == 源码版本（-ci 后缀的测试 tag 豁免，用于演练发布线）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go test ./...

      # Linux 裸机启动冒烟。存在的理由：上面的交叉矩阵只证明「编得出来」，而本仓库的
      # Linux 专属分支（0600 凭据权限、WB2A_* 环境变量覆盖、时区警告、优雅停机）在
      # Windows 开发机上要么看不见、要么永远为真。这里在真实 Linux 上逐个跑出正/负两面。
      - name: Linux 裸机启动冒烟
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          BIN="$RUNNER_TEMP/buddyhub-smoke"
          go build -trimpath -ldflags="-s -w" -o "$BIN" ./cmd/server
          PORT=7899
          BASE="http://127.0.0.1:$PORT"

          wait_ready() { # $1=日志文件
            for _ in $(seq 1 60); do
              code=$(curl -s -o "$1.health" -w '%{http_code}' "$BASE/healthz" || echo 000)
              if [ "$code" = 200 ] || [ "$code" = 503 ]; then return 0; fi
              sleep 0.5
            done
            return 1
          }

          # ---- A) 全新目录、无配置、无凭据（新人 clone 后第一命令的形态）----
          A="$RUNNER_TEMP/a"; mkdir -p "$A"; cd "$A"
          export WB2A_LISTEN="127.0.0.1:$PORT"
          "$BIN" -config config.json > a.log 2>&1 &
          APID=$!
          wait_ready a || { kill "$APID" 2>/dev/null || true; cat a.log; fail "A: 60 次探测内没起来"; }
          grep -q '"api_key": "sk-' config.json || fail "A: 首启没自动生成随机 api_key"
          [ "$(stat -c '%a' config.json)" = "600" ] || fail "A: config.json 权限应为 600，实为 $(stat -c '%a' config.json)"
          grep -q '"service":"buddyhub"' a.health || fail "A: /healthz 没透出 service=buddyhub"
          grep -q "listening on 127.0.0.1:$PORT" a.log || fail "A: WB2A_LISTEN 没生效（日志端口不对）"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/v1/models")" = "401" ] || fail "A: 无密钥 /v1/models 应 401"
          KEY=$(sed -n 's/.*"api_key": "\(sk-[^"]*\)".*/\1/p' config.json)
          [ "$(curl -s -o a.models -w '%{http_code}' -H "Authorization: Bearer $KEY" "$BASE/v1/models")" = "200" ] || fail "A: 带密钥 /v1/models 应 200"
          grep -q '"object":"model"' a.models || fail "A: /v1/models 没返回模型目录"
          [ "$(curl -s -o a.panel -w '%{http_code}' "$BASE/panel/")" = "200" ] || fail "A: 面板页应 200"
          ct=$(curl -s -o /dev/null -w '%{content_type}' "$BASE/panel/js/boot.js")
          [ "$ct" = "text/javascript; charset=utf-8" ] || fail "A: 面板 JS 没内嵌进二进制（content-type=$ct）"
          # runner 默认 UTC → 排程按北京时间划天，两条时间线错开，警告必须出现
          grep -q '主机时区' a.log || fail "A: UTC 宿主上没打时区警告（正例失败）"
          kill -TERM "$APID"
          for _ in $(seq 1 20); do kill -0 "$APID" 2>/dev/null || break; sleep 0.5; done
          if kill -0 "$APID" 2>/dev/null; then fail "A: SIGTERM 10 秒内没退出"; fi
          grep -q 'bye$' a.log || fail "A: 没走优雅停机路径（日志缺 bye）"

          # ---- B) TZ=Asia/Shanghai（容器/systemd 的推荐形态）→ 同一警告必须消失 ----
          B="$RUNNER_TEMP/b"; mkdir -p "$B"; cd "$B"
          export TZ=Asia/Shanghai
          "$BIN" -config config.json > b.log 2>&1 &
          BPID=$!
          wait_ready b || { kill "$BPID" 2>/dev/null || true; cat b.log; fail "B: 没起来"; }
          if grep -q '主机时区' b.log; then fail "B: 主机已是北京时间还警告（负例失败）"; fi
          kill -TERM "$BPID"; wait "$BPID" 2>/dev/null || true
          unset TZ

          # ---- C) 用 config.example.json 起步 → 公开占位密钥必须就地换掉并写回 ----
          C="$RUNNER_TEMP/c"; mkdir -p "$C"; cd "$C"
          cp "$GITHUB_WORKSPACE/config.example.json" config.json
          grep -q '"api_key": "test_key"' config.json || fail "C: 样例配置已不含 test_key，本用例前提变了"
          export TZ=UTC
          "$BIN" -config config.json > c.log 2>&1 &
          CPID=$!
          wait_ready c || { kill "$CPID" 2>/dev/null || true; cat c.log; fail "C: 没起来"; }
          grep -q '示例占位符' c.log || fail "C: 没报告占位密钥被轮换"
          ! grep -q '"api_key": "test_key"' config.json || fail "C: 写回失败，文件里还是公开占位密钥"
          [ "$(stat -c '%a' config.json)" = "600" ] || fail "C: 写回后权限应为 600"
          kill -TERM "$CPID"; wait "$CPID" 2>/dev/null || true

      # Linux 单文件 bind mount 上 rename 会失败（EBUSY/EXDEV），配置写回因此要走
      # 就地 O_TRUNC 回退路径 —— 这正是 Docker 部署唯一能碰到它的地方。
      - name: 单文件 bind mount 下配置写回
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          BIN="$RUNNER_TEMP/buddyhub-smoke"
          SRC="$RUNNER_TEMP/mnt/config.json"
          DST="$RUNNER_TEMP/mnt/inside.json"
          mkdir -p "$RUNNER_TEMP/mnt" "$(dirname "$DST")"
          cp "$GITHUB_WORKSPACE/config.example.json" "$SRC"
          touch "$DST"
          sudo mount --bind "$SRC" "$DST" || { echo "::notice::runner 不支持 bind mount，跳过"; exit 0; }
          cd "$(dirname "$DST")"
          WB2A_LISTEN=127.0.0.1:7901 TZ=UTC timeout 25 "$BIN" -config "$DST" > d.log 2>&1 &
          DPID=$!
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7901/healthz || echo 000)
            { [ "$code" = 200 ] || [ "$code" = 503 ]; } && break
            sleep 0.5
          done
          kill -TERM "$DPID" 2>/dev/null || true; wait "$DPID" 2>/dev/null || true
          sudo umount "$DST"
          grep -q '示例占位符' d.log || { cat d.log; fail "占位密钥没走回退路径写回"; }
          ! grep -q '"api_key": "test_key"' "$SRC" || fail "bind mount 目标没被写回"
          echo "回退路径 OK：挂载文件已就地轮换密钥"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 取源码版本号
        id: ver
        run: echo "v=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)" >> "$GITHUB_OUTPUT"

      - name: 构建（剥离符号，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "buddyhub${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含源码 appVersion（防交叉编译矩阵里编错树/漏 ldflags）
      - name: 断言二进制版本串
        run: |
          BIN="buddyhub${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          V="${V%-panel}"   # 文件名不带 -panel 后缀（buddyhub-v1.2.3-... 既有惯例）
          case "${{ matrix.goos }}" in
            windows)
              NAME="buddyhub-v${V}-windows-amd64.zip"
              zip -q "$NAME" buddyhub.exe config.example.json README.md
              ;;
            *)
              NAME="buddyhub-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" buddyhub config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # 仅 tag 触发：校验 tag == 源码版本（-ci 演练 tag 豁免）→ 汇总资产 → 建 Release
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取历史 tag 算 compare 链接
      - name: tag 与源码版本一致性断言
        run: |
          SRC=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          SRC="${SRC%-panel}"   # appVersion 带 -panel 后缀，比对前剥掉
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与源码 appVersion=$SRC 不一致（先提交版本号再打 tag）"
              exit 1
            fi
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: 上一版 tag（compare 链接用）
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}-panel
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            CI 自动构建发布（五平台二进制 + checksums）。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ github.ref_name }}
          files: dist/*
